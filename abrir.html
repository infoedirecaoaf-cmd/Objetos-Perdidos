<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>Objetos Perdidos</title>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Objetos Perdidos">
  <meta name="theme-color" content="#0b57d0">

  <link
    rel="apple-touch-icon"
    sizes="180x180"
    href="https://infoedirecaoaf-cmd.github.io/Objetos-Perdidos/apple-touch-icon.png?v=4"
  >

  <link
    rel="preload"
    as="image"
    href="https://infoedirecaoaf-cmd.github.io/Objetos-Perdidos/apple-touch-icon.png?v=4"
  >

  <link
    rel="manifest"
    href="./manifest.webmanifest?v=4"
  >

  <style>
    body {
      margin: 0;
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6f9;

      text-align: center;
    }

    .conteudo {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    #iconeSistema {
      width: 110px;
      height: 110px;

      border-radius: 24px;

      object-fit: cover;

      opacity: 0;
      transition: opacity 0.15s ease;
    }

    #iconeSistema.carregado {
      opacity: 1;
    }

    h2 {
      color: #174ea6;
      margin-top: 28px;
      margin-bottom: 14px;
    }

    p {
      color: #5f6368;
      margin: 0;
    }
  </style>

</head>

<body>

  <div class="conteudo">

    <img
      id="iconeSistema"
      src="https://infoedirecaoaf-cmd.github.io/Objetos-Perdidos/apple-touch-icon.png?v=4"
      alt="Objetos Perdidos"
    >

    <h2>
      Abrindo o Objetos Perdidos…
    </h2>

    <p>
      Aguarde um instante.
    </p>

  </div>

  <script>

    const URL_SISTEMA =
      "https://script.google.com/macros/s/AKfycbwSlmJrmQNIvK3fqJV4pm7p6oTmlaVOzFlNNI1VEEvvzBZOy735fXtxagnurgMuDYe9EA/exec";

    const icone =
      document.getElementById("iconeSistema");

    let redirecionando = false;


    function abrirSistema() {

      if (redirecionando) {
        return;
      }

      redirecionando = true;

      /*
       * Mantém a tela visível por um instante
       * depois que o ícone carregar.
       */
      setTimeout(function () {

        window.location.replace(
          URL_SISTEMA
        );

      }, 800);

    }


    function iconeCarregado() {

      icone.classList.add(
        "carregado"
      );

      abrirSistema();

    }


    /*
     * Se o ícone já estiver no cache do iPhone.
     */
    if (
      icone.complete &&
      icone.naturalWidth > 0
    ) {

      iconeCarregado();

    } else {

      /*
       * Aguarda realmente o ícone carregar
       * antes de entrar no sistema.
       */
      icone.addEventListener(
        "load",
        iconeCarregado,
        { once: true }
      );

    }


    /*
     * Segurança:
     * mesmo se houver algum problema de internet
     * com a imagem, o sistema abre normalmente.
     */
    setTimeout(function () {

      abrirSistema();

    }, 3000);

  </script>

</body>

</html>
